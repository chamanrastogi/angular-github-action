name: Anhular First workflow
on:
  push:
jobs:
  build-angular:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout on VM
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"


      - name: Install dependencies
        run: npm install

      - name: Build Angular Project
        run: npm run build --prod
